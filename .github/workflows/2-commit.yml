name: 2. Kalshi-Hive — Distribute & Commit
on:
  workflow_run:
    workflows: ["1. Kalshi-Hive — Calculate & Analyze"]
    types:
      - completed
concurrency:
  group: kalshi-nexus-commit
  cancel-in-progress: false
jobs:
  distribute:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write
    steps:
      - name: Download Data
        uses: actions/download-artifact@v4
        with:
          name: nexus-data
          path: temp_data
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.TOKEN1 }}

      # Mission 1: kalshi-core (private) 업데이트
      - name: Checkout kalshi-core
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.KALSHI_PRIVATE_REPO }}
          token: ${{ secrets.TOKEN1 }}
          path: private-brain

      - name: Push Assets to kalshi-core
        run: |
          cd private-brain
          mkdir -p data_output/archive data_output/api/v1/events data_output/audit_logs data_output/completed_events
          [ -f ../temp_data/active_events.json ]     && cp ../temp_data/active_events.json       data_output/
          [ -d ../temp_data/archive_events ]          && cp -r ../temp_data/archive_events/*      data_output/archive/ || true
          [ -d ../temp_data/api ]                     && cp -r ../temp_data/api/*                 data_output/api/ || true
          [ -d ../temp_data/audit_logs ]              && cp -r ../temp_data/audit_logs/*          data_output/audit_logs/ || true
          [ -f ../temp_data/regime_changes.json ]     && cp ../temp_data/regime_changes.json      data_output/
          [ -d ../temp_data/completed_events ]        && cp -r ../temp_data/completed_events/*    data_output/completed_events/ || true
          git config --global user.name  "Kalshi-Nexus Bot"
          git config --global user.email "bot@kalshinexus.com"
          git add data_output/
          if git diff --staged --quiet; then
            echo "✅ No private changes."
          else
            git commit -m "🧠 Update Kalshi Assets [$(date)]"
            git pull --rebase -X theirs origin main
            git push
          fi

      # Mission 2: kalshi-feed (public) — docs/data만 업데이트
      - name: Checkout kalshi-feed
        uses: actions/checkout@v4
        with:
          path: public-face

      - name: Push Intelligence to kalshi-feed
        run: |
          cd public-face
          mkdir -p docs/data
          [ -f ../temp_data/latest_intelligence.json ] && cp ../temp_data/latest_intelligence.json docs/data/
          [ -f ../temp_data/regime_changes.json ]      && cp ../temp_data/regime_changes.json      docs/data/
          git config --global user.name  "Kalshi-Nexus Bot"
          git config --global user.email "bot@kalshinexus.com"
          git add docs/data/
          if git diff --staged --quiet; then
            echo "✅ No public changes."
          else
            git commit -m "📢 Update Kalshi Dashboard [$(date)]"
            git pull --rebase -X theirs origin main
            git push
          fi