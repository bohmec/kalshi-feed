name: 1. Calculate & Analyze (Kalshi)

on:
  schedule:
    - cron: '5-59/15 * * * *'
  workflow_dispatch:

jobs:
  calculate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout kalshi-core
        uses: actions/checkout@v4
        with:
          repository: bohmec/kalshi-core
          token: ${{ secrets.TOKEN1 }}
          path: private-brain

      - name: Checkout kalshi-db
        uses: actions/checkout@v4
        with:
          repository: bohmec/kalshi-db
          token: ${{ secrets.TOKEN1 }}
          path: kalshi_db

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Libraries
        run: pip install -r private-brain/requirements.txt

      - name: Run Engine
        env:
          KALSHI_KEY_ID:      ${{ secrets.KALSHI_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
          KALSHI_DB_DIR:      ${{ github.workspace }}/kalshi_db
        run: |
          cd private-brain
          python main.py

      - name: Commit DB changes
        if: always()
        run: |
          cd ${{ github.workspace }}/kalshi_db
          git config user.name  "kalshi-nexus-bot"
          git config user.email "bot@kalshi-nexus"
          git add -A
          if git diff --staged --quiet; then
            echo "✅ No DB changes."
          else
            git commit -m "auto: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git pull --rebase -X theirs origin main
            git push
          fi

      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: nexus-data
          path: private-brain/data_output/
          retention-days: 1