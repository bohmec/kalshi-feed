name: 1. Kalshi-Hive — Calculate & Analyze

on:
  repository_dispatch:
    types: [kalshi-hive-run]
  workflow_dispatch:

concurrency:
  group: kalshi-nexus-fetch
  cancel-in-progress: true

jobs:
  calculate:
    runs-on: ubuntu-latest
    # [추가] timeout: 1시간 cadence 기준 여유 10분
    timeout-minutes: 35
    permissions:
      contents: read

    steps:
      - name: Checkout kalshi-core
        uses: actions/checkout@v4
        with:
          repository: bohmec/kalshi-core
          token: ${{ secrets.TOKEN1 }}
          path: private-brain

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('private-brain/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install Libraries
        run: pip install -r private-brain/requirements.txt

      - name: Run Engine
        env:
          KALSHI_KEY_ID:          ${{ secrets.KALSHI_KEY_ID }}
          KALSHI_PRIVATE_KEY:     ${{ secrets.KALSHI_PRIVATE_KEY }}
          KALSHI_SUPABASE_URL:    ${{ secrets.KALSHI_SUPABASE_URL }}
          KALSHI_SUPABASE_KEY:    ${{ secrets.KALSHI_SUPABASE_KEY }}
          R2_ACCOUNT_ID:          ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID:       ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY:   ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          cd private-brain
          python main.py

      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: nexus-data
          path: private-brain/data_output/
          retention-days: 1